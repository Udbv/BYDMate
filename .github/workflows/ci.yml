name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Budget: a PR is checked in about 5 minutes. A clean compile alone takes ~4 min and the 8k unit
# tests ~5 min on one runner, so:
#  - every job restores the build state (app/build, .gradle) of the newest earlier run and Gradle
#    compiles only what changed (~30 s for an ordinary PR) — the `build-state` cache below;
#  - the unit tests run in three parallel shards (-Pbydmate.testShard), two workers each;
#  - lint and detekt are jobs of their own. On a PR lint checks the waze main sources; a push to
#    develop or main lints both flavors with the tests and refreshes the state PRs start from.
# Kover's coverage agent is off on CI (see app/build.gradle.kts): it cost a third of the test time.

env:
  # Caches written by pushes (develop, main) seed the PRs; a PR reads them and keeps its own
  # state for its next push.
  GRADLE_CACHE_READ_ONLY: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ env.GRADLE_CACHE_READ_ONLY }}

      - name: Restore build state
        uses: actions/cache/restore@v5
        with:
          path: |
            .gradle
            app/build
            bydauto-stubs/build
            !app/build/reports
            !app/build/test-results
            !app/build/outputs
          key: build-state-v1-${{ github.sha }}
          restore-keys: build-state-v1-

      - name: Compile
        run: ./gradlew :app:compileWazeDebugUnitTestKotlin --stacktrace

      # One shard saves the compiled state for the next run of this branch and the PRs after it.
      - name: Save build state
        if: matrix.shard == 1
        uses: actions/cache/save@v5
        with:
          path: |
            .gradle
            app/build
            bydauto-stubs/build
            !app/build/reports
            !app/build/test-results
            !app/build/outputs
          key: build-state-v1-${{ github.sha }}

      - name: Unit tests
        run: ./gradlew :app:testWazeDebugUnitTest -Pbydmate.testShard=${{ matrix.shard }}/3 -Pbydmate.testForks=2 --stacktrace

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.shard }}
          path: app/build/reports/
          retention-days: 14

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ env.GRADLE_CACHE_READ_ONLY }}

      - name: Restore build state
        uses: actions/cache/restore@v5
        with:
          path: |
            .gradle
            app/build
            bydauto-stubs/build
            !app/build/reports
            !app/build/test-results
            !app/build/outputs
          key: build-state-v1-${{ github.sha }}
          restore-keys: build-state-v1-

      - name: Android Lint (PR)
        if: github.event_name == 'pull_request'
        run: ./gradlew :app:lintWazeDebug -Pbydmate.lintMainOnly --stacktrace

      - name: Android Lint (push)
        if: github.event_name != 'pull_request'
        run: ./gradlew :app:lintWazeDebug :app:lintOfficialDebug --stacktrace

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: app/build/reports/
          retention-days: 14

  detekt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ env.GRADLE_CACHE_READ_ONLY }}

      - name: detekt
        run: ./gradlew :app:detekt --stacktrace

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: detekt-reports
          path: app/build/reports/
          retention-days: 14

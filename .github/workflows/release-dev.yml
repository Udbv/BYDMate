name: Dev release

# Builds the signed `waze` release APK and publishes it as a pre-release, so the car's Development
# update channel picks it up. Runs by itself when a push to develop touches app/build.gradle.kts or
# the release notes and the versionName there has no release yet — so cutting a dev build is: bump
# versionName, add docs/release-notes/v<versionName>.md, merge into develop (the phone is enough).
# Pushes that leave the version alone find its release already there and stop without building.
# workflow_dispatch is kept for re-runs; GitHub only offers the button for workflows on the default
# branch (main), so until this file reaches main use "Re-run jobs" on a failed run instead.
#
# One-time setup, Settings → Secrets and variables → Actions → New repository secret:
#   KEYSTORE_BASE64    base64 of bydmate-waze.jks (PowerShell:
#                      [Convert]::ToBase64String([IO.File]::ReadAllBytes("D:\BYD\keys\bydmate-waze.jks")) | Set-Clipboard)
#   KEYSTORE_PASSWORD  storePassword from keystore.properties
#   KEY_ALIAS          keyAlias (bydmate-waze)
#   KEY_PASSWORD       keyPassword
# It must be the same key as every earlier release, or Android refuses the update in the car.

on:
  push:
    branches: [develop]
    paths:
      - app/build.gradle.kts
      - docs/release-notes/**
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to release from
        default: develop
        required: true

permissions:
  contents: write

concurrency:
  group: release-dev
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Read version
        id: version
        run: |
          name=$(sed -n 's/^ *versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          [ -n "$name" ] || { echo "::error::versionName not found in app/build.gradle.kts"; exit 1; }
          case "$name" in *-dev.*) ;; *) echo "::error::$name is not a -dev.N version; stable releases go through main"; exit 1;; esac
          notes="docs/release-notes/v$name.md"
          [ -f "$notes" ] || { echo "::error::$notes is missing"; exit 1; }
          if gh release view "v$name" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::release v$name already exists, nothing to publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Keystore
        if: steps.version.outputs.skip != 'true'
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::KEYSTORE_BASE64 secret is not set"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build
        if: steps.version.outputs.skip != 'true'
        run: ./gradlew :app:assembleWazeRelease --stacktrace

      # An unsigned APK would not install over the copy in the car, so never publish one.
      - name: Verify signature
        id: apk
        if: steps.version.outputs.skip != 'true'
        run: |
          apk="app/build/outputs/apk/waze/release/BYDMate-Waze-v${{ steps.version.outputs.name }}.apk"
          [ -f "$apk" ] || { echo "::error::$apk not built"; exit 1; }
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk" | grep -E "Signer #1 certificate (DN|SHA-256)"
          echo "path=$apk" >> "$GITHUB_OUTPUT"

      - name: Publish pre-release
        if: steps.version.outputs.skip != 'true'
        run: |
          gh release create "v${{ steps.version.outputs.name }}" \
            --repo "$GITHUB_REPOSITORY" --target "$(git rev-parse HEAD)" --prerelease \
            --title "BYDMate Waze ${{ steps.version.outputs.name }}" \
            --notes-file "${{ steps.version.outputs.notes }}" \
            "${{ steps.apk.outputs.path }}"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" keystore.properties

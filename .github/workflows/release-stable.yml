name: Stable release

# A push to main (develop merged after the real-car test) promotes the pre-release that develop
# already published for the same versionName to a full release and marks it latest, so the app's
# Stable channel (releases/latest) offers it. Nothing is rebuilt: the APK users get is the exact
# binary that was tested in the car. The tag keeps its -dev.N name because the APK reports that
# versionName, and the in-app checker needs tag == "v" + versionName to see itself as current.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-stable
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the ancestry check below needs the tag's commit

      - name: Promote the tested pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name=$(sed -n 's/^ *versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          [ -n "$name" ] || { echo "::error::versionName not found in app/build.gradle.kts"; exit 1; }
          tag="v$name"

          if ! release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" 2>/dev/null); then
            echo "::error::no release $tag yet: merge into develop first so the dev build is published, test it in the car, then merge into main"
            exit 1
          fi
          id=$(printf '%s' "$release" | jq -r .id)
          if [ "$(printf '%s' "$release" | jq -r .prerelease)" != "true" ]; then
            echo "::notice::$tag is already a full release, nothing to do"
            exit 0
          fi
          apks=$(printf '%s' "$release" | jq '[.assets[] | select(.name | endswith(".apk"))] | length')
          [ "$apks" -ge 1 ] || { echo "::error::$tag has no APK attached"; exit 1; }

          # Promote only the build of code that main actually contains.
          git merge-base --is-ancestor "$tag" HEAD \
            || { echo "::error::$tag points at a commit that is not in main"; exit 1; }

          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" \
            -F prerelease=false -f make_latest=true -f name="BYDMate Waze $name" >/dev/null
          echo "::notice::$tag promoted to a full release and marked latest"

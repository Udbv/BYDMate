name: Stable release

# A push to main (develop merged after the real-car test) cuts the stable release of the build
# that was tested: the pre-release v<X.Y.Z-dev.N> that develop published for the versionName on
# main. The stable APK is rebuilt from that very tag with only the name changed, X.Y.Z, so the
# car and the Stable channel see a proper version instead of a -dev one (until 2026-10-31 the
# dev pre-release itself was promoted and the stable build was called 4.1.0-dev.23). The code is
# the tested code, byte for byte; versionCode stays the dev build's, so it installs over it.
# It is published as v<X.Y.Z>, a full release marked latest; the dev tag stays a pre-release.
# The notes are docs/release-notes/v<X.Y.Z>.md, or the dev build's when there is none.
#
# Needs the same signing secrets as release-dev.yml.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-stable
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the tag and the ancestry check need the history

      - name: Find the tested build
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dev=$(sed -n 's/^ *versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          [ -n "$dev" ] || { echo "::error::versionName not found in app/build.gradle.kts"; exit 1; }
          stable="${dev%%-*}"
          echo "dev=$dev" >> "$GITHUB_OUTPUT"
          echo "stable=$stable" >> "$GITHUB_OUTPUT"

          if gh release view "v$stable" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::v$stable is already released, nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release view "v$dev" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || { echo "::error::no release v$dev: merge into develop first so the dev build is published, test it in the car, then merge into main"; exit 1; }
          # Release only the build of code that main actually contains.
          git merge-base --is-ancestor "v$dev" HEAD \
            || { echo "::error::v$dev points at a commit that is not in main"; exit 1; }

          notes="docs/release-notes/v$stable.md"
          if [ ! -f "$notes" ]; then
            notes="$RUNNER_TEMP/notes.md"
            git show "v$dev:docs/release-notes/v$dev.md" > "$notes" 2>/dev/null \
              || echo "Stable build of v$dev." > "$notes"
          fi
          cp "$notes" "$RUNNER_TEMP/stable-notes.md"

      # The tested commit, not main's head: main may carry later docs or workflow changes.
      - name: Check out the tested commit
        if: steps.version.outputs.skip != 'true'
        run: |
          git checkout --quiet "v${{ steps.version.outputs.dev }}"
          sed -i 's/^\( *versionName = "\)${{ steps.version.outputs.dev }}"/\1${{ steps.version.outputs.stable }}"/' app/build.gradle.kts
          grep -q 'versionName = "${{ steps.version.outputs.stable }}"' app/build.gradle.kts \
            || { echo "::error::could not set versionName"; exit 1; }

      - uses: actions/setup-java@v5
        if: steps.version.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        if: steps.version.outputs.skip != 'true'

      - name: Keystore
        if: steps.version.outputs.skip != 'true'
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::KEYSTORE_BASE64 secret is not set"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build
        if: steps.version.outputs.skip != 'true'
        run: ./gradlew :app:assembleWazeRelease --stacktrace

      # An unsigned APK would not install over the copy in the car, so never publish one.
      - name: Verify signature
        id: apk
        if: steps.version.outputs.skip != 'true'
        run: |
          apk="app/build/outputs/apk/waze/release/BYDMate-Waze-v${{ steps.version.outputs.stable }}.apk"
          [ -f "$apk" ] || { echo "::error::$apk not built"; exit 1; }
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          certs=$("$apksigner" verify --print-certs "$apk")
          printf '%s\n' "$certs" | grep -E "certificate (DN|SHA-256 digest):"
          echo "path=$apk" >> "$GITHUB_OUTPUT"

      - name: Publish stable release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dev="${{ steps.version.outputs.dev }}"
          stable="${{ steps.version.outputs.stable }}"
          gh release create "v$stable" \
            --repo "$GITHUB_REPOSITORY" --target "$(git rev-parse HEAD)" --latest \
            --title "BYDMate Waze $stable" \
            --notes-file "$RUNNER_TEMP/stable-notes.md" \
            "${{ steps.apk.outputs.path }}"
          # The tested dev build stays what it was: a pre-release. An earlier workflow promoted
          # dev builds themselves, so put one back if it was.
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$dev" --jq .id)
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F prerelease=true >/dev/null
          echo "::notice::v$stable released from the tested v$dev and marked latest"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" keystore.properties

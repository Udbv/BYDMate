# Sized for GitHub's ubuntu-latest runners (4 vCPU, 16 GB), which also fits a dev machine: the
# release build's R8 and lintVital share this heap and drove a 4 GB old generation to ~95 %.
# The Kotlin daemon gets its own bound instead of inheriting the 6 GB.
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4g -XX:+UseParallelGC
# Task outputs are reused from ~/.gradle/caches/build-cache-1 (CI persists it via setup-gradle).
org.gradle.caching=true
# The configured task graph is reused when the build scripts and their inputs are unchanged.
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
